<nav class="w-full bg-neutral-900 text-white px-8 py-4 flex items-center justify-between shadow">
  <div class="text-2xl font-bold">KICKstore</div>
  <div class="flex items-center gap-8 text-gray-300">
    <a routerLink="/" class="hover:text-blue-400">Inicio</a>
    <a routerLink="/catalog" class="hover:text-blue-400">Catálogo</a>

    <ng-container *ngIf="!auth.isLogged()">
      <a routerLink="/login"
        class="border border-gray-500 px-4 py-2 rounded-lg hover:border-blue-400 hover:text-blue-400">
        Iniciar sesión
      </a>
    </ng-container>

    <ng-container *ngIf="auth.isLogged()">
      <ng-container *ngIf="auth.isAdmin()">
        <a routerLink="/admin/products" class="hover:text-amber-400">Admin · Productos</a>
        <a routerLink="/admin/orders" class="hover:text-amber-400">Admin · Pedidos</a>
      </ng-container>

      <ng-container *ngIf="auth.isUser()">
        <a routerLink="/orders" class="hover:text-blue-400">Mis pedidos</a>
        <button routerLink="/cart" class="relative">
          <span class="material-icons text-2xl">shopping_bag</span>
          <span *ngIf="5 > 0" class="absolute -top-2 -right-2 bg-orange-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">5</span>
        </button>
      </ng-container>

      <span class="text-blue-400">{{ auth.user().user_metadata?.full_name }}</span>

      <button (click)="logout()" class="hover:text-red-400">Salir</button>
    </ng-container>
  </div>
</nav>
