<footer class="bg-[#0a0a0a] text-gray-400 py-8 px-5 lg:px-10 font-sans border-t border-[#111]">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between gap-16">
    <div class="md:w-1/3">
      <div class="font-bold text-[17px] tracking-tight mb-4 text-white animate-pulse">
        LAIA<span class="text-pink-500 font-medium">store</span>
      </div>
      <p class="text-[13px] text-gray-500 font-medium">Las mejores zapatillas, a tu medida.</p>
    </div>

    <div class="flex gap-20 md:gap-32">
      <div>
        <h3 class="text-[11px] font-bold text-gray-500 uppercase tracking-[0.2em] mb-6">Tienda</h3>
        <ul class="space-y-4 text-[13px] font-semibold text-gray-400">
          <li><a routerLink="/catalog" class="hover:text-white transition-colors duration-300">Catálogo</a></li>
          <li><a routerLink="/catalog" [queryParams]="{ category: 'running' }"
              class="hover:text-white transition-colors duration-300">Running</a></li>
          <li><a routerLink="/catalog" [queryParams]="{ category: 'basketball' }"
              class="hover:text-white transition-colors duration-300">Basketball</a></li>
          <li><a routerLink="/catalog" [queryParams]="{ category: 'lifestyle' }"
              class="hover:text-white transition-colors duration-300">Lifestyle</a></li>
        </ul>
      </div>

      <div>
        <h3 class="text-[11px] font-bold text-gray-500 uppercase tracking-[0.2em] mb-6">Mi cuenta</h3>
        <ul class="space-y-4 text-[13px] font-semibold text-gray-400">
          <li><a routerLink="/login" class="hover:text-white transition-colors duration-300">Iniciar sesión</a></li>
          <li><a routerLink="/register" class="hover:text-white transition-colors duration-300">Crear cuenta</a></li>
          <li *ngIf="auth.isLogged() && auth.isUser()"><a routerLink="/orders"
              class="hover:text-white transition-colors duration-300">Mis pedidos</a></li>
          <li *ngIf="auth.isLogged() && !auth.isAdmin()"><a routerLink="/cart"
              class="hover:text-white transition-colors duration-300">Carrito</a></li>
        </ul>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto mt-6 pt-8 border-t border-[#1f1f1f] text-center">
    <p class="text-[11px] font-medium text-[#555]">© 2026 LAIAstore. Todos los derechos reservados.</p>
  </div>
</footer>
