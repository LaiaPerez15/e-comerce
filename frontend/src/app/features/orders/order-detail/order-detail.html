<div class="min-h-screen bg-neutral-100 px-8 py-12">
  <div class="max-w-4xl mx-auto">

    <a routerLink="/orders" class="text-neutral-600 hover:text-neutral-900 text-sm">
      ← Volver a mis pedidos
    </a>

    <div *ngIf="loading()" class="mt-6 text-neutral-500">Cargando pedido...</div>

    <div *ngIf="order()" class="mt-6 bg-white border border-neutral-200 rounded-2xl p-8 shadow-sm">

      <h1 class="text-3xl font-black text-neutral-900">
        Pedido #{{ order().id }}
      </h1>

      <p class="text-neutral-500 mt-1">
        {{ order().created_at | date:'dd/MM/yyyy HH:mm' }}
      </p>

      <div class="mt-4">
        <span class="px-3 py-1 rounded-full text-xs font-bold"
              [ngClass]="{
                'bg-yellow-100 text-yellow-700': order().status === 'pending',
                'bg-blue-100 text-blue-700': order().status === 'processing',
                'bg-green-100 text-green-700': order().status === 'completed'
              }">
          {{ order().status }}
        </span>
      </div>

      <h2 class="mt-8 text-xl font-bold text-neutral-800">Productos</h2>

      <div class="mt-4 space-y-4">
        <div *ngFor="let item of order().order_items"
             class="flex justify-between items-center border-b border-neutral-200 pb-4">

          <div>
            <p class="font-semibold text-neutral-900">{{ item.product_name }}</p>
            <p class="text-neutral-500 text-sm">Talla {{ item.size }}</p>
          </div>

          <p class="font-bold text-orange-600">{{ item.price }} €</p>
        </div>
      </div>

      <div class="mt-8 text-right">
        <p class="text-neutral-600">Total</p>
        <p class="text-2xl font-black text-neutral-900">{{ order().total }} €</p>
      </div>
    </div>
  </div>
</div>
