<div class="min-h-screen bg-neutral-100 px-8 py-12">
  <div class="max-w-7xl mx-auto mb-10">
    <div class="flex items-center justify-between">
      <div>
        <span class="text-orange-500 text-xs font-bold tracking-[0.3em] uppercase">
          Usuario
        </span>
        <h1 class="text-4xl font-black text-neutral-900 mt-1 tracking-tight">
          Mis pedidos
        </h1>
      </div>

      <a routerLink="/catalog" class="text-neutral-600 hover:text-neutral-900 text-sm">
        Seguir comprando →
      </a>
    </div>
  </div>

  <div class="max-w-7xl mx-auto">
    <div *ngIf="!loading() && orders().length === 0"
      class="bg-white border border-neutral-200 rounded-2xl p-16 text-center shadow-sm">
      <span class="material-symbols-outlined text-neutral-400 mb-6" style="font-size: 48px;">
        inventory_2
      </span>

      <h2 class="text-2xl font-black text-neutral-900">
        Aún no tienes pedidos
      </h2>

      <p class="text-neutral-500 mt-2">
        Cuando realices tu primer pedido aparecerá aquí
      </p>

      <a routerLink="/catalog"
        class="inline-block mt-8 bg-black text-white px-6 py-3 rounded-lg text-sm font-bold hover:bg-neutral-800 transition">
        Ver catálogo
      </a>
    </div>

    <div *ngIf="!loading() && orders().length > 0" class="space-y-6">
      <div *ngFor="let o of orders()" class="bg-white border border-neutral-200 rounded-2xl p-6 shadow-sm">

        <div class="flex justify-between items-center">
          <div>
            <p class="font-black text-neutral-900 text-lg">Pedido #{{ o.id }}</p>
            <p class="text-neutral-500 text-sm">{{ o.created_at | date:'dd/MM/yyyy HH:mm' }}</p>
          </div>

          <span class="px-3 py-1 rounded-full text-xs font-bold" [ngClass]="{
                  'bg-yellow-100 text-yellow-700': o.status === 'pending',
                  'bg-blue-100 text-blue-700': o.status === 'processing',
                  'bg-green-100 text-green-700': o.status === 'completed'
                }">
            {{ o.status }}
          </span>
        </div>

        <div class="mt-4 text-neutral-700">
          <p class="font-bold">Total: {{ o.total }} €</p>
        </div>

        <button routerLink="/orders/{{ o.id }}" class="mt-4 text-orange-600 hover:text-orange-500 font-medium text-sm">
          Ver detalles →
        </button>
      </div>
    </div>
  </div>
</div>
