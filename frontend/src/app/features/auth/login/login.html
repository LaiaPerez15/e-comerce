<div class="min-h-[80vh] flex items-center justify-center px-4 py-16 bg-black text-white relative overflow-hidden">
  <!-- Radial gradients -->
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(236,72,153,0.08),transparent_35%),radial-gradient(circle_at_bottom_left,rgba(236,72,153,0.03),transparent_30%)] pointer-events-none"></div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-[#080808]/90 border border-neutral-900 shadow-2xl rounded-3xl p-8 w-full max-w-md space-y-6 relative z-10 backdrop-blur-sm">
    <div class="text-center">
      <h1 class="text-3xl font-black text-pink-500 text-glow-pink tracking-tight">LAIA<span class="text-white">store</span></h1>
      <p class="text-xl font-extrabold text-white mt-3">Bienvenido de nuevo</p>
      <p class="text-neutral-500 text-xs mt-1">Inicia sesión para acceder a tu cuenta premium</p>
    </div>

    <div class="space-y-5">
      <div>
        <label class="block text-xs font-black tracking-widest text-neutral-400 uppercase">Email</label>
        <input type="email" formControlName="email"
          class="w-full mt-1.5 px-4 py-3 bg-neutral-950 border border-neutral-900 rounded-xl focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 text-white transition outline-none" />

        <p *ngIf="form.controls['email'].touched && form.controls['email'].hasError('required')"
          class="text-rose-500 text-xs mt-1.5 font-semibold">
          El email es obligatorio.
        </p>

        <p *ngIf="form.controls['email'].touched && form.controls['email'].hasError('email')"
          class="text-rose-500 text-xs mt-1.5 font-semibold">
          Ingresa un email válido.
        </p>
      </div>

      <div>
        <label class="block text-xs font-black tracking-widest text-neutral-400 uppercase">Contraseña</label>
        <input type="password" formControlName="password"
          class="w-full mt-1.5 px-4 py-3 bg-neutral-950 border border-neutral-900 rounded-xl focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 text-white transition outline-none" />

        <p *ngIf="form.controls['password'].touched && form.controls['password'].invalid"
          class="text-rose-500 text-xs mt-1.5 font-semibold">
          La contraseña es obligatoria.
        </p>
      </div>

      <p *ngIf="form.controls['email'].touched && form.controls['email'].hasError('invalidCredentials')"
        class="text-center text-xs text-rose-500 font-semibold bg-rose-550/10 border border-rose-500/20 p-3 rounded-xl mt-4">
        Credenciales incorrectas. Inténtalo de nuevo.
      </p>

      <button type="submit"
              class="w-full mt-2 bg-pink-500 hover:bg-pink-400 text-black font-extrabold py-4 rounded-xl transition shadow-[0_4px_15px_rgba(236,72,153,0.2)] hover:shadow-[0_4px_25px_rgba(236,72,153,0.35)] text-xs tracking-widest uppercase">
        Iniciar sesión
      </button>

      <p class="text-center text-xs text-neutral-500 mt-4">
        ¿No tienes cuenta?
        <a routerLink="/register" class="text-pink-500 font-extrabold hover:underline transition ml-1">
          Regístrate
        </a>
      </p>
    </div>
  </form>
</div>
