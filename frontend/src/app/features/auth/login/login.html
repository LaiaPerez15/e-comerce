<div class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow">
  <h2 class="text-2xl font-bold mb-6">Iniciar sesión</h2>
  <form (submit)="onSubmit($event)" class="space-y-4">
    <input type="email" [(ngModel)]="email" name="email" placeholder="Correo" class="w-full p-3 border rounded-lg" required />
    <input type="password" [(ngModel)]="password" name="password" placeholder="Contraseña" class="w-full p-3 border rounded-lg" required />
    <button class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">Entrar</button>
  </form>
</div>
