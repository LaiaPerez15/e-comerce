<div class="flex-1 flex items-center justify-center px-4 py-10">
    <form (submit)="onSubmit($event)" class="bg-white shadow-xl rounded-xl p-8 w-full max-w-md space-y-6">

        <h1 class="text-2xl font-bold text-start">KICKstore</h1>
        <p class="text-start text-xl font-bold text-zinc-500">Crea tu cuenta</p>
        <p class="text-start text-zinc-400 text-sm">Empieza a comprar hoy</p>

        <div class="space-y-4">
            <div>
                <label class="text-sm text-zinc-600">Nombre completo</label>
                <input type="text" [(ngModel)]="name" name="name"
                    class="w-full bg-zinc-100 px-4 py-2 rounded-lg border border-zinc-300" placeholder="Alizon Rosales"
                    required />
            </div>

            <div>
                <label class="text-sm text-zinc-600">Email</label>
                <input type="email" [(ngModel)]="email" name="email"
                    class="w-full bg-zinc-100 px-4 py-2 rounded-lg border border-zinc-300" placeholder="tu@email.com"
                    required />
            </div>

            <div>
                <label class="text-sm text-zinc-600">Contraseña</label>
                <input type="password" [(ngModel)]="password" name="password"
                    class="w-full bg-zinc-100 px-4 py-2 rounded-lg border border-zinc-300"
                    placeholder="Mínimo 6 caracteres" required />
            </div>

            <div>
                <label class="text-sm text-zinc-600">Confirmar contraseña</label>
                <input type="password" [(ngModel)]="passwordConfirm" name="passwordConfirm"
                    class="w-full bg-zinc-100 px-4 py-2 rounded-lg border border-zinc-300"
                    placeholder="Repite la contraseña" required />
            </div>

            <button class="w-full bg-black text-white py-2 rounded-lg hover:bg-zinc-900">
                Crear cuenta
            </button>

            <p class="text-center text-sm text-red-500">{{ error }}</p>

            <p class="text-center text-sm text-zinc-500">
                ¿Ya tienes cuenta?
                <a routerLink="/login" class="text-black font-semibold hover:underline">
                    Inicia sesión
                </a>
            </p>

        </div>

    </form>
</div>
