<div class="min-h-screen bg-neutral-100 px-8 py-12">
  <div class="max-w-7xl mx-auto mb-10">
    <div class="flex items-center justify-between">
      <div>
        <span class="text-orange-500 text-xs font-bold tracking-[0.3em] uppercase">
          Administración
        </span>
        <h1 class="text-4xl font-black text-neutral-900 mt-1 tracking-tight">
          Gestión de pedidos
        </h1>
        <p class="text-neutral-500 mt-2">
          {{ orders().length }} pedidos registrados
        </p>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto">
    <div *ngIf="loading()" class="text-neutral-500 text-sm">
      Cargando pedidos...
    </div>

    <div *ngIf="!loading()" class="bg-white border border-neutral-200 rounded-2xl overflow-hidden shadow-sm">
      <table class="w-full text-left">
        <thead class="bg-neutral-50 text-neutral-600 text-xs uppercase tracking-widest border-b border-neutral-200">
          <tr>
            <th class="px-6 py-4">Pedido</th>
            <th class="px-6 py-4">Usuario</th>
            <th class="px-6 py-4">Total</th>
            <th class="px-6 py-4">Estado</th>
            <th class="px-6 py-4 text-right">Acciones</th>
          </tr>
        </thead>

        <tbody class="text-neutral-700">
          <tr *ngFor="let o of orders()" class="border-b border-neutral-200 hover:bg-neutral-50 transition">
            <td class="px-6 py-4 font-semibold text-neutral-900">
              #{{ o.id }}
            </td>

            <td class="px-6 py-4 text-neutral-500">
              {{ o.profiles?.email }}
            </td>

            <td class="px-6 py-4 text-orange-600 font-bold">
              {{ o.total }} €
            </td>

            <td class="px-6 py-4">
              <span
                class="px-3 py-1 rounded-full text-xs font-medium"
                [ngClass]="{
                  'bg-yellow-100 text-yellow-700': o.status === 'pending',
                  'bg-blue-100 text-blue-700': o.status === 'processing',
                  'bg-green-100 text-green-700': o.status === 'completed'
                }"
              >
                {{ o.status }}
              </span>
            </td>

            <td class="px-6 py-4 align-middle">
              <div class="flex gap-4 justify-end items-center">
                <button
                  (click)="viewOrder(o)"
                  class="text-orange-600 hover:text-orange-500 font-medium"
                >
                  Ver detalles
                </button>

                <button
                  (click)="changeStatus(o)"
                  class="text-neutral-600 hover:text-neutral-500 font-medium"
                >
                  Cambiar estado
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
