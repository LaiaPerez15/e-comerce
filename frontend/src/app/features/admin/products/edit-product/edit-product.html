<div *ngIf="open" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-40" (click)="close()"></div>

<div *ngIf="open" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl z-50 p-8 overflow-y-auto
            transform transition-transform duration-300 translate-x-0">

  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-neutral-900">Editar producto</h2>
    <button (click)="close()" class="text-neutral-500 hover:text-black text-2xl leading-none">×</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="space-y-6">
    <div>
      <label class="block text-sm font-medium mb-2">Imagen del producto</label>

      <label
        class="flex flex-col items-center justify-center w-full h-48 rounded-xl border border-dashed border-neutral-300 bg-neutral-50 hover:bg-neutral-100 cursor-pointer transition">

        <svg class="w-12 h-12 text-neutral-400" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 16.5l4-4h-3V3h-2v9.5H8l4 4z" />
          <path d="M20 18H4v-2H2v2a2 2 0 002 2h16a2 2 0 002-2v-2h-2v2z" />
        </svg>

        <span class="mt-2 text-sm text-neutral-500">
          Haz clic para subir una nueva imagen
        </span>

        <input type="file" class="hidden" (change)="onFileSelected($event)" />
      </label>

      <p *ngIf="imageName" class="text-sm text-neutral-600 mt-2">
        Archivo seleccionado: <strong>{{ imageName }}</strong>
      </p>

      <img *ngIf="product?.image_url && !imageFile" [src]="product.image_url"
        class="mt-4 w-full h-56 object-cover rounded-xl border border-neutral-300" />

      <img *ngIf="imageFile" [src]="imageFile | fileUrl"
        class="mt-4 w-full h-56 object-cover rounded-xl border border-neutral-300" />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Nombre</label>
      <input type="text" formControlName="name"
        class="w-full bg-neutral-100 px-4 py-2 rounded-lg border border-neutral-300" />

      <p class="text-red-600 text-sm mt-1" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
        El nombre es obligatorio.
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Marca</label>
      <input type="text" formControlName="brand"
        class="w-full bg-neutral-100 px-4 py-2 rounded-lg border border-neutral-300" />

      <p class="text-red-600 text-sm mt-1" *ngIf="form.get('brand')?.touched && form.get('brand')?.invalid">
        La marca es obligatoria.
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Categoría</label>
      <select formControlName="category_id"
        class="w-full bg-neutral-100 px-4 py-2 rounded-lg border border-neutral-300 appearance-none">
        <option value="">Selecciona una categoría</option>
        <option *ngFor="let c of categories" [value]="c.id">
          {{ c.name }}
        </option>
      </select>

      <p class="text-red-600 text-sm mt-1" *ngIf="form.get('category_id')?.touched && form.get('category_id')?.invalid">
        Debes seleccionar una categoría.
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Precio (€)</label>
      <input type="number" formControlName="price"
        class="w-full bg-neutral-100 px-4 py-2 rounded-lg border border-neutral-300" />

      <p class="text-red-600 text-sm mt-1" *ngIf="form.get('price')?.touched && form.get('price')?.invalid">
        El precio debe ser mayor a 0.
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Stock</label>
      <input type="number" formControlName="stock"
        class="w-full bg-neutral-100 px-4 py-2 rounded-lg border border-neutral-300" />

      <p class="text-red-600 text-sm mt-1" *ngIf="form.get('stock')?.touched && form.get('stock')?.invalid">
        El stock no puede ser negativo.
      </p>
    </div>

    <div class="flex justify-between pt-4">
      <button type="button" (click)="close()"
        class="px-4 py-2 rounded-lg border border-neutral-400 hover:bg-neutral-100">
        Cancelar
      </button>

      <button type="submit" class="px-4 py-2 rounded-lg bg-black text-white hover:bg-neutral-800">
        Guardar cambios
      </button>
    </div>
  </form>
</div>
