<div class="min-h-screen bg-neutral-100 px-8 py-12">
  <div class="max-w-7xl mx-auto mb-10">
    <div class="flex items-center justify-between">
      <div>
        <span class="text-orange-500 text-xs font-bold tracking-[0.3em] uppercase">
          Administración
        </span>
        <h1 class="text-4xl font-black text-neutral-900 mt-1 tracking-tight">
          Gestión de productos
        </h1>
        <p class="text-neutral-500 mt-2">
          {{ products().length }} productos en el catálogo
        </p>
      </div>

      <button
        (click)="openCreate()"
        class="bg-orange-500 hover:bg-orange-400 text-white font-bold px-6 py-3 rounded-lg transition text-sm tracking-wide shadow-md">
        + Nuevo producto
      </button>
    </div>
  </div>

  <div class="max-w-7xl mx-auto">
    <div *ngIf="loading()" class="text-neutral-500 text-sm">
      Cargando productos...
    </div>

    <div *ngIf="!loading()" class="bg-white border border-neutral-200 rounded-2xl overflow-hidden shadow-sm">
      <table class="w-full text-left">
        <thead class="bg-neutral-50 text-neutral-600 text-xs uppercase tracking-widest border-b border-neutral-200">
          <tr>
            <th class="px-6 py-4">Producto</th>
            <th class="px-6 py-4">Categoría</th>
            <th class="px-6 py-4">Precio</th>
            <th class="px-6 py-4">Stock</th>
            <th class="px-6 py-4">Estado</th>
            <th class="px-6 py-4 text-right">Acciones</th>
          </tr>
        </thead>

        <tbody class="text-neutral-700">
          <tr *ngFor="let p of products()" class="border-b border-neutral-200 hover:bg-neutral-50 transition">
            <td class="px-6 py-4">
              <div class="flex items-center gap-4">
                <img
                  [src]="p.image_url"
                  class="w-14 h-14 rounded-xl object-cover border border-neutral-300"
                />
                <div>
                  <p class="font-semibold text-neutral-900">{{ p.name }}</p>
                  <p class="text-xs text-neutral-500 uppercase tracking-widest">{{ p.brand }}</p>
                </div>
              </div>
            </td>

            <td class="px-6 py-4 text-neutral-500">{{ p.categories?.name }}</td>
            <td class="px-6 py-4 text-orange-600 font-bold">{{ p.price }} €</td>
            <td class="px-6 py-4">{{ p.stock }}</td>

            <td class="px-6 py-4">
              <span class="px-3 py-1 rounded-full text-xs bg-green-100 text-green-700 font-medium">
                Activo
              </span>
            </td>

            <td class="px-6 py-4 align-middle">
              <div class="flex gap-4 justify-end items-center">
                <button (click)="openEdit(p)" class="text-orange-600 hover:text-orange-500 font-medium">
                  Editar
                </button>

                <button (click)="deleteProduct(p)" class="text-red-600 hover:text-red-500 font-medium">
                  Eliminar
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<app-create-product
  [open]="isCreateOpen()"
  [categories]="categories()"
  (closed)="isCreateOpen.set(false)"
  (created)="loadProducts()"
></app-create-product>

<app-edit-product
  [open]="isEditOpen()"
  [product]="selectedProduct()"
  [categories]="categories()"
  (closed)="isEditOpen.set(false)"
  (updated)="loadProducts()"
></app-edit-product>
