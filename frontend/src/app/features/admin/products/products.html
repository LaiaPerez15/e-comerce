<div class="min-h-screen bg-black text-white px-6 lg:px-8 py-16 relative overflow-hidden">
  <!-- Radial gradients -->
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(236,72,153,0.08),transparent_35%),radial-gradient(circle_at_bottom_left,rgba(236,72,153,0.03),transparent_30%)] pointer-events-none"></div>

  <!-- HEADER -->
  <div class="max-w-7xl mx-auto mb-10 relative z-10">
    <div class="flex items-center justify-between border-b border-neutral-900 pb-6 flex-wrap gap-4">
      <div>
        <span class="text-pink-500 text-xs font-bold tracking-[0.3em] uppercase">
          Administración
        </span>
        <h1 class="text-4xl font-black text-white mt-1 tracking-tight">
          Gestión de productos
        </h1>
        <p class="text-neutral-500 text-xs mt-1.5 font-semibold">
          {{ products().length }} productos en el catálogo
        </p>
      </div>

      <button
        (click)="openCreate()"
        class="bg-pink-500 hover:bg-pink-400 text-black font-extrabold px-6 py-3.5 rounded-xl transition shadow-[0_4px_15px_rgba(236,72,153,0.2)] hover:shadow-[0_4px_25px_rgba(236,72,153,0.35)] text-xs tracking-widest uppercase">
        + Nuevo producto
      </button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="max-w-7xl mx-auto relative z-10">
    <div *ngIf="loading()" class="text-neutral-500 text-sm font-semibold animate-pulse">
      Cargando productos...
    </div>

    <div *ngIf="!loading()" class="bg-[#080808]/90 border border-neutral-900 rounded-3xl overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead class="bg-neutral-950 text-neutral-400 text-[10px] font-black uppercase tracking-widest border-b border-neutral-900">
            <tr>
              <th class="px-6 py-4">Producto</th>
              <th class="px-6 py-4">Categoría</th>
              <th class="px-6 py-4">Precio</th>
              <th class="px-6 py-4">Stock</th>
              <th class="px-6 py-4">Estado</th>
              <th class="px-6 py-4 text-right">Acciones</th>
            </tr>
          </thead>

          <tbody class="text-neutral-450 text-sm">
            <tr *ngFor="let p of products()" class="border-b border-neutral-900 hover:bg-neutral-950/45 transition">
              <td class="px-6 py-4">
                <div class="flex items-center gap-4">
                  <img
                    [src]="p.image_url || 'assets/placeholder.png'"
                    class="w-14 h-14 rounded-xl object-cover border border-neutral-800"
                  />
                  <div>
                    <p class="font-extrabold text-white text-sm md:text-base">{{ p.name }}</p>
                    <p class="text-[10px] text-neutral-500 uppercase tracking-widest font-bold mt-0.5">{{ p.brand }}</p>
                  </div>
                </div>
              </td>

              <td class="px-6 py-4 text-neutral-500 font-medium">{{ p.categories?.name }}</td>
              <td class="px-6 py-4 text-pink-500 font-extrabold">{{ p.price }} €</td>
              <td class="px-6 py-4 font-semibold">{{ p.stock }}</td>

              <td class="px-6 py-4">
                <span class="px-3 py-1 rounded-md text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-black uppercase tracking-wider">
                  Activo
                </span>
              </td>

              <td class="px-6 py-4 align-middle">
                <div class="flex gap-4 justify-end items-center">
                  <button (click)="openEdit(p)" class="text-pink-500 hover:text-pink-400 font-extrabold text-xs uppercase tracking-wider transition">
                    Editar
                  </button>

                  <button (click)="deleteProduct(p)" class="text-rose-500 hover:text-rose-450 font-extrabold text-xs uppercase tracking-wider transition">
                    Eliminar
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<app-create-product
  [open]="isCreateOpen()"
  [categories]="categories()"
  (closed)="isCreateOpen.set(false)"
  (created)="loadProducts()"
></app-create-product>

<app-edit-product
  [open]="isEditOpen()"
  [product]="selectedProduct()"
  [categories]="categories()"
  (closed)="isEditOpen.set(false)"
  (updated)="loadProducts()"
></app-edit-product>
