<div *ngIf="open" class="fixed inset-0 flex justify-end bg-black/60 backdrop-blur-sm z-50">
    <div class="bg-[#080808]/95 border-l border-neutral-900 w-full sm:w-[450px] h-full shadow-2xl p-6 overflow-y-auto text-white flex flex-col justify-between">
        <div>
            <div class="flex items-center justify-between border-b border-neutral-900 pb-4 mb-6">
                <h2 class="text-xl font-extrabold text-white tracking-tight">Crear producto</h2>
                <button (click)="close()" class="text-neutral-450 hover:text-white transition">✕</button>
            </div>

            <form [formGroup]="form" (ngSubmit)="save()" class="space-y-5">
                <div>
                    <label class="block text-xs font-black tracking-widest text-neutral-400 uppercase mb-2">Imagen del producto</label>
                    <label
                        class="flex flex-col items-center justify-center w-full h-36 rounded-2xl border border-dashed border-neutral-800 bg-neutral-950 hover:bg-neutral-900 hover:border-pink-500/30 cursor-pointer transition duration-200">
                        <svg class="w-10 h-10 text-neutral-500" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 16.5l4-4h-3V3h-2v9.5H8l4 4z" />
                            <path d="M20 18H4v-2H2v2a2 2 0 002 2h16a2 2 0 002-2v-2h-2v2z" />
                        </svg>
                        <span class="mt-2 text-xs text-neutral-500">Haz clic para subir una imagen</span>
                        <input type="file" class="hidden" (change)="onFileSelected($event)" />
                    </label>

                    <p *ngIf="imageName" class="text-xs text-pink-400 mt-2 font-medium">
                        Archivo: <strong>{{ imageName }}</strong>
                    </p>
                </div>

                <div>
                    <label class="block text-xs font-black tracking-widest text-neutral-400 uppercase">Nombre</label>
                    <input type="text" formControlName="name"
                        class="w-full mt-1.5 px-4 py-3 bg-neutral-950 border border-neutral-900 rounded-xl focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 text-white transition outline-none" />
                    <p *ngIf="form.controls['name'].touched && form.controls['name'].invalid"
                        class="text-rose-500 text-xs mt-1.5 font-semibold">
                        El nombre es obligatorio.
                    </p>
                </div>

                <div>
                    <label class="block text-xs font-black tracking-widest text-neutral-400 uppercase">Marca</label>
                    <input type="text" formControlName="brand"
                        class="w-full mt-1.5 px-4 py-3 bg-neutral-950 border border-neutral-900 rounded-xl focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 text-white transition outline-none" />
                    <p *ngIf="form.controls['brand'].touched && form.controls['brand'].invalid"
                        class="text-rose-500 text-xs mt-1.5 font-semibold">
                        La marca es obligatoria.
                    </p>
                </div>

                <div>
                    <label class="block text-xs font-black tracking-widest text-neutral-400 uppercase">Categoría</label>
                    <select formControlName="category_id"
                        class="w-full mt-1.5 px-4 py-3 bg-neutral-950 border border-neutral-900 rounded-xl focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 text-white transition outline-none appearance-none">
                        <option value="">Selecciona una categoría</option>
                        <option *ngFor="let c of categories" [value]="c.id">
                            {{ c.name }}
                        </option>
                    </select>
                    <p *ngIf="form.controls['category_id'].touched && form.controls['category_id'].invalid"
                        class="text-rose-500 text-xs mt-1.5 font-semibold">
                        Debes seleccionar una categoría.
                    </p>
                </div>

                <div>
                    <label class="block text-xs font-black tracking-widest text-neutral-400 uppercase">Precio (€)</label>
                    <input type="number" formControlName="price"
                        class="w-full mt-1.5 px-4 py-3 bg-neutral-950 border border-neutral-900 rounded-xl focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 text-white transition outline-none" />
                    <p *ngIf="form.controls['price'].touched && form.controls['price'].invalid"
                        class="text-rose-500 text-xs mt-1.5 font-semibold">
                        El precio debe ser mayor a 0.
                    </p>
                </div>

                <div>
                    <label class="block text-xs font-black tracking-widest text-neutral-400 uppercase">Stock</label>
                    <input type="number" formControlName="stock"
                        class="w-full mt-1.5 px-4 py-3 bg-neutral-950 border border-neutral-900 rounded-xl focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 text-white transition outline-none" />
                    <p *ngIf="form.controls['stock'].touched && form.controls['stock'].invalid"
                        class="text-rose-500 text-xs mt-1.5 font-semibold">
                        El stock no puede ser negativo.
                    </p>
                </div>

                <div class="flex justify-between pt-6 border-t border-neutral-900">
                    <button type="button" (click)="close()"
                        class="px-5 py-3 rounded-xl border border-neutral-850 hover:bg-neutral-900 text-neutral-400 font-extrabold text-xs uppercase tracking-wider transition">
                        Cancelar
                    </button>

                    <button type="submit" 
                            class="px-5 py-3 rounded-xl bg-pink-500 hover:bg-pink-400 text-black font-extrabold text-xs uppercase tracking-wider transition shadow-[0_4px_15px_rgba(236,72,153,0.2)]">
                        Crear producto
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
