<div *ngIf="open" class="fixed inset-0 flex justify-end bg-black/30 backdrop-blur-sm z-50">
    <div class="bg-white w-full sm:w-105 h-full shadow-xl p-6 overflow-y-auto">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold">Crear producto</h2>
            <button (click)="close()" class="text-neutral-500 hover:text-black">✕</button>
        </div>

        <form [formGroup]="form" (ngSubmit)="save()" class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2">Imagen del producto</label>
                <label
                    class="flex flex-col items-center justify-center w-full h-36 rounded-xl border border-dashed border-neutral-300 bg-neutral-50 hover:bg-neutral-100 cursor-pointer transition">
                    <svg class="w-10 h-10 text-neutral-400" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 16.5l4-4h-3V3h-2v9.5H8l4 4z" />
                        <path d="M20 18H4v-2H2v2a2 2 0 002 2h16a2 2 0 002-2v-2h-2v2z" />
                    </svg>
                    <span class="mt-2 text-sm text-neutral-500">Haz clic para subir una imagen</span>
                    <input type="file" class="hidden" (change)="onFileSelected($event)" />
                </label>

                <p *ngIf="imageName" class="text-sm text-neutral-600 mt-2">
                    Archivo seleccionado: <strong>{{ imageName }}</strong>
                </p>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Nombre</label>
                <input type="text" formControlName="name"
                    class="w-full bg-zinc-100 px-4 py-2 rounded-lg border border-zinc-300" />
                <p *ngIf="form.controls['name'].touched && form.controls['name'].invalid"
                    class="text-red-600 text-xs mt-1">
                    El nombre es obligatorio.
                </p>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Marca</label>
                <input type="text" formControlName="brand"
                    class="w-full bg-zinc-100 px-4 py-2 rounded-lg border border-zinc-300" />
                <p *ngIf="form.controls['brand'].touched && form.controls['brand'].invalid"
                    class="text-red-600 text-xs mt-1">
                    La marca es obligatoria.
                </p>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Categoría</label>
                <select formControlName="category_id"
                    class="w-full bg-zinc-100 px-4 py-2 rounded-lg border border-zinc-300 appearance-none">
                    <option value="">Selecciona una categoría</option>
                    <option *ngFor="let c of categories" [value]="c.id">
                        {{ c.name }}
                    </option>
                </select>
                <p *ngIf="form.controls['category_id'].touched && form.controls['category_id'].invalid"
                    class="text-red-600 text-xs mt-1">
                    Debes seleccionar una categoría.
                </p>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Precio (€)</label>
                <input type="number" formControlName="price"
                    class="w-full bg-zinc-100 px-4 py-2 rounded-lg border border-zinc-300" />
                <p *ngIf="form.controls['price'].touched && form.controls['price'].invalid"
                    class="text-red-600 text-xs mt-1">
                    El precio debe ser mayor a 0.
                </p>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Stock</label>
                <input type="number" formControlName="stock"
                    class="w-full bg-zinc-100 px-4 py-2 rounded-lg border border-zinc-300" />
                <p *ngIf="form.controls['stock'].touched && form.controls['stock'].invalid"
                    class="text-red-600 text-xs mt-1">
                    El stock no puede ser negativo.
                </p>
            </div>

            <div class="flex justify-between pt-4">
                <button type="button" (click)="close()"
                    class="px-4 py-2 rounded-lg border border-zinc-400 hover:bg-zinc-100">
                    Cancelar
                </button>

                <button type="submit" class="px-4 py-2 rounded-lg bg-black text-white hover:bg-neutral-800">
                    Crear producto
                </button>
            </div>
        </form>
    </div>
</div>
